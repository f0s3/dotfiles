# ============================================================
# Hyprland Configuration
# Migrated from i3/X11 — see design doc for rationale
# ============================================================

# Monitor (fallback — Kanshi handles actual profiles)
monitor = , preferred, auto, 1

# Autostart daemons
exec-once = hyprpaper > /dev/null 2>&1
exec-once = waybar
exec-once = fcitx5 -d
exec-once = kanshi
exec-once = hypridle
exec-once = ~/.local/bin/fcitx5-workspace-layout.sh
# Scratchpad terminal — spawned directly into special:magic workspace
exec-once = [workspace special:magic silent] kitty --class scratchkitty

# Input
input {
    kb_layout = us
    kb_options = grp:win_space_toggle
    repeat_rate = 30
    repeat_delay = 300
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Cursor
env = XCURSOR_THEME,phinger-cursors-dark
env = XCURSOR_SIZE,24
cursor {
    no_hardware_cursors = false
}

# General
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7129FFee)
    col.inactive_border = rgba(181818ee)
    layout = dwindle
}

# Decoration
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 4
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        color = rgba(00000088)
    }
}

# Animations
animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 3, ease
    animation = workspaces, 1, 3, ease
    animation = fade, 1, 3, ease
    animation = specialWorkspace, 1, 3, ease, fade
}

# Dwindle tiling
dwindle {
    pseudotile = false
    preserve_split = true
    force_split = 2
}

# Misc
misc {
    font_family = DejaVuSansM Nerd Font Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# Window rules — scratchpad terminal (tiled, full workspace)
windowrule {
    name = scratchkitty-rules
    match:class = scratchkitty
    animation = popin
}

# Keybindings
$mod = SUPER

# Workspaces / Kitty tabs — context-aware via dispatch script
bind = $mod, 1, exec, ~/.local/bin/dispatch-workspace.sh 1
bind = $mod, 2, exec, ~/.local/bin/dispatch-workspace.sh 2
bind = $mod, 3, exec, ~/.local/bin/dispatch-workspace.sh 3
bind = $mod, 4, exec, ~/.local/bin/dispatch-workspace.sh 4
bind = $mod, 5, exec, ~/.local/bin/dispatch-workspace.sh 5
bind = $mod, 6, exec, ~/.local/bin/dispatch-workspace.sh 6
bind = $mod, 7, exec, ~/.local/bin/dispatch-workspace.sh 7
bind = $mod, 8, exec, ~/.local/bin/dispatch-workspace.sh 8
bind = $mod, 9, exec, ~/.local/bin/dispatch-workspace.sh 9
bind = $mod, 0, exec, ~/.local/bin/dispatch-workspace.sh 10

# Move focused window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Toggle split orientation
bind = $mod, S, layoutmsg, togglesplit

# Swap focused window with neighbour
bind = $mod, left,  swapwindow, l
bind = $mod, right, swapwindow, r
bind = $mod, up,    swapwindow, u
bind = $mod, down,  swapwindow, d

# Scratchpad terminal
bind = $mod, T, exec, ~/.local/bin/toggle-scratchpad.sh

# Application launcher
bind = $mod, D, exec, pkill wofi || wofi --show drun

# Keyboard layout toggle
bind = $mod, SPACE, exec, ~/.local/bin/fcitx5-workspace-layout.sh toggle

# Window management
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exec, ~/.local/bin/powermenu.sh
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | tee ~/Images/Screenshots/$(date +%Y-%m-%d_%H:%M:%S).png | wl-copy
bind = $mod, F, togglefloating
bind = $mod, M, fullscreen

# Lid switch — disable laptop screen on close, re-enable on open
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-2, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-2, 2560x1600@120, 0x0, 1.6"

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
